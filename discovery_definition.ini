[discovery_extension_definition]

short_name = "pandorafms.postgresql_monitor"
section = "app"
name = "DB PostgreSQL Monitoring"
version = "1.1.8"
description = "PostgreSQL monitoring: one DB session, multiline SQL, and connection/query error details in Discovery Task Summary."

execution_file[_exec1_] = "pandorafms_postgresql.py"

exec[] = "/usr/bin/python3 _exec1_ --config '_configFile_' --outdir '__incomingDir__' --lock-file '/tmp/pandorafms-postgresql-__taskMD5__.lock' --run-log '_runlog_' --sql-files '_sqlFile1_' '_sqlFile2_' '_sqlFile3_' '_sqlFile4_' '_sqlFile5_' '_sqlFile6_' '_sqlFile7_' '_sqlFile8_' '_sqlFile9_' '_sqlFile10_'"

default_value[_port_] = 5432
default_value[_database_] = "postgres"
default_value[_agent_] = ""
default_value[_sslmode_] = "prefer"
default_value[_connectTimeout_] = 10
default_value[_statementTimeout_] = 15000
default_value[_lockTimeout_] = 3000
default_value[_maxRows_] = 100
default_value[_modulePrefix_] = ""
default_value[_basicInfo_] = true
