[postgres_target]

macro[1] = _host_
name[1] = "PostgreSQL host / IP"
type[1] = string
placeholder[1] = "10.10.6.40"

macro[2] = _port_
name[2] = "PostgreSQL port"
type[2] = number

macro[3] = _database_
name[3] = "Database"
type[3] = string
placeholder[3] = "postgres"

macro[4] = _user_
name[4] = "Monitoring username"
type[4] = string
placeholder[4] = "pandorafms"

macro[5] = _password_
name[5] = "Monitoring password"
type[5] = password

macro[6] = _agent_
name[6] = "Pandora agent name"
type[6] = string
placeholder[6] = "PG-host-database"
required_field[6] = false
mandatory_field[6] = false

macro[7] = _group_
name[7] = "Agent group"
type[7] = select
select_data[7] = agent_groups

macro[8] = _sslmode_
name[8] = "PostgreSQL SSL mode"
type[8] = select
select_data[8] = postgres_ssl_modes

macro[9] = _modulePrefix_
name[9] = "Module name prefix"
type[9] = string
placeholder[9] = "PG:"
required_field[9] = false
mandatory_field[9] = false

[postgres_ssl_modes]
option[disable] = "disable"
option[allow] = "allow"
option[prefer] = "prefer"
option[require] = "require"
option[verify-ca] = "verify-ca"
option[verify-full] = "verify-full"

